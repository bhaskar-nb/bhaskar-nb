name: Update GitHub Streak

on:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          path: profile/streak.svg
          options: "user=${{ github.repository_owner }}&theme=github-dark-blue&hide_border=true&background=0D1117&ring=58A6FF&fire=58A6FF&currStreakLabel=79C0FF&sideLabels=79C0FF&currStreakNum=FFFFFF&sideNums=FFFFFF&dates=AAAAAA&disable_animations=true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update GitHub streak card" || exit 0
          git push
