name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: bhaskar-nb
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2360a5fa&color_dots=%23161b22,%231e3a5f,%232563a8,%233b82f6,%2360a5fa
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2393c5fd&color_dots=%23161b22,%231e3a5f,%232563a8,%233b82f6,%2360a5fa

      - name: Publish snake SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
